	<script language="JavaScript" type="text/javascript"><!--

//Global variables to store browser info
var ver=navigator.appVersion;
var dom=document.getElementById?1:0;
var ie5=(this.ver.indexOf("MSIE 5")>-1&&this.dom)?1:0;
var ie4=(document.all&&!this.dom)?1:0;
var ns5=(this.dom&&parseInt(this.ver)>=5)?1:0;
var ns4=(document.layers&&!this.dom)?1:0;
var BrowserOK=(ie5||ie4||ns5)?1:0;
var sw = screen.width;
var sh = screen.height;

//Zooming scripts
function getElement(id){
	if(BrowserOK){
		if(ie4||ie5){
			return document.all[id].style;
		}else{
			return document.getElementById[id];
		}
	}
}
function zoomin(id){
	if(BrowserOK){
		zEl = getElement(id);
		zEl.fontSize = 15;
		zEl.width = 350;
		zEl.zIndex = 100;
	}
}
function zoomout(id){
	if(BrowserOK){
		zEl = getElement(id);
		zEl.fontSize = 5;
		zEl.width = 200;
		zEl.zIndex = 0;
	}
}

//window opening script
function openWindow(url,type,scrolling) {
	//set size and position of the window to be opened
	var WindowWidth;
	var WindowHeight;
	var PixelsFromLeft;
	var PixelsFromTop;
	var WindowName;
	if(type=="1"){
		WindowWidth = 508;
		WindowHeight = 500;
		PixelsFromLeft = 40;
		PixelsFromTop = 80;
		WindowName = "Type1";
	} else if (type=="2"){
		WindowWidth = 308;
		WindowHeight = 580;
		PixelsFromLeft = 500;
		PixelsFromTop = 100;
		WindowName = "Type2";
	} else if (type=="3"){
 		WindowWidth = 308;
		WindowHeight = 360;
		PixelsFromLeft = 400;
		PixelsFromTop = 20;
		WindowName = "Type3";
	} else if (type=="4"){
		WindowWidth = 408;
		WindowHeight = 500;
		PixelsFromLeft = 100;
		PixelsFromTop = 100;
		WindowName = "Type4";
	} else if (type=="5"){
		WindowWidth = 508;
		WindowHeight = 300;
		PixelsFromLeft = 100;
		PixelsFromTop = 70;
		WindowName = "Type5";
	} else if (type=="6"){
		WindowWidth = 508;
		WindowHeight = 540;
		PixelsFromLeft = 80;
		PixelsFromTop = 50;
		WindowName = "Type6";
	} else {
		return;
	}
	//store values in an options string
	var opts="toolbar=no,location=no,directories=no,status=no,resizeable=no,copyhistory=no,menubar=no"
	if(scrolling){
		opts = opts+",scrollbars=yes"
	}else{
	    opts = opts+",scrollbars=no"
	}
	if (ns5 || ns4) {
		opts=opts+",innerWidth="+WindowWidth+",innerHeight="+WindowHeight+",screenX="+PixelsFromLeft+",screenY="+PixelsFromTop;
	} else if (ie4 || ie5) {
		opts=opts+",width="+WindowWidth+",height="+WindowHeight+",left="+PixelsFromLeft+",top="+PixelsFromTop;
	} else {
		opts = opts+",width="+WindowWidth+",height="+WindowHeight;
	}
	newWindow = window.open(url,WindowName,opts);
	newWindow.window.focus();
}

//scrolling scripts

//scroll speeds for the zones
var speed1=8;
var speed2=3;

//global variables
var isScrollingX=0;
var isScrollingY=0;
var scrollX;
var scrollY;
var timeout=0;

//define zones around the sides of the screen
var t1=Math.floor(sh/12);
var t2=Math.floor(sh/6);
var b1=Math.floor(sh-(sh/12));
var b2=Math.floor(sh-(sh/6));
var l1=Math.floor(sw/12);
var l2=Math.floor(sw/6);
var r1=Math.floor(sw-(sw/12));
var r2=Math.floor(sw-(sw/6));

//initialise
function Init(){
	if(ns4) document.captureEvents(Event.MOUSEMOVE);
	document.onmousemove=scrollIt;
}

//find position on screen and start scrolling if at the edges
function scrollIt(e){
	x=(ns4||ns5)?e.screenX:event.screenX;
	y=(ns4||ns5)?e.screenY:event.screenY;
	if((x<l2)||(x>r2)||(y<t2)||(y>b2)){
		if((x<l2)||(x>r2)){
			if(x<l1){
				scrollX = -speed1;
			}else if((x<l2)&&(x>=l1)){
				scrollX = -speed2;
			}else if(x>r1){
				scrollX = speed1;
			}else if((x>r2)&&(x<=r1)){
				scrollX = speed2;
			}else{
				scrollX = 0;
			}
		}else{
			scrollX = 0;
		}
		if((y<t2)||(y>b2)){
			if(y<t1){
				scrollY = -speed1;
 			}else if((y<t2)&&(y>=t1)){
				scrollY = -speed2;
			}else if(y>b1){
				scrollY = speed1;
			}else if((y>b2)&&(y<=b1)){
				scrollY = speed2;
			}else{
				scrollY = 0;
			}
		}else{
			scrollY = 0;
		}
		if((scrollY!=0)||(scrollX!=0)){
			startScrolling(scrollX,scrollY);
		}
	}else if((!isScrollingX)&&(!isScrollingY)){
		return;
	}else{
		stopScrolling();
	}
}
//activate the scroll function if needed
function startScrolling(scrollX,scrollY){
	if((isScrollingX==scrollX)&&(isScrollingY==scrollY)){
		return;
	}else{
		stopScrolling();
		scroll(scrollX,scrollY);
	}
}
//function to stop page scrolling
function stopScrolling(){
	clearTimeout(timeout);
	isScrollingX=0;
	isScrollingY=0;
}
//function to scroll the page
function scroll(scrollX,scrollY){
	window.scrollBy(scrollX,scrollY);
	isScrollingX=scrollX;
	isScrollingY=scrollY;
	timeout=setTimeout("scroll("+scrollX+","+scrollY+")",1);
}
//-->
</script>
